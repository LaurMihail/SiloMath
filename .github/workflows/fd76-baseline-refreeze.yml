name: FD76 Baseline Refreeze One-Shot

on:
  push:
    branches:
      - baseline-supabase-canonical-backend-2026-10-29
    paths:
      - .github/workflows/fd76-baseline-refreeze.yml

permissions:
  contents: write

jobs:
  apply-fd76:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: baseline-supabase-canonical-backend-2026-10-29
          fetch-depth: 0

      - name: Apply controlled FD-76 documentation delta
        run: python3 engineering/apply_fd76_refreeze.py

      - name: Regenerate requirement registry and RVM
        shell: bash
        run: |
          set -e
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -File engineering/build-requirement-registry.ps1
            pwsh -NoProfile -File engineering/build-rvm.ps1
          else
            echo 'pwsh not available; PR validators will report any required generated-file delta.'
          fi

      - name: Verify refreeze validation
        shell: bash
        run: python3 -c "import json; d=json.load(open('governance_evidence/SiloMath_V6_Refreeze_Validation_2026-10-29_SUPABASE.json')); assert d['result']=='PASS'; print(json.dumps(d, indent=2))"

      - name: Commit controlled refreeze result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add baseline engineering governance_evidence
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Refreeze V6 on Supabase canonical backend FD-76'
            git push origin HEAD:baseline-supabase-canonical-backend-2026-10-29
          fi

name: FD76 Registry Fix One-Shot

on:
  push:
    branches:
      - baseline-supabase-canonical-backend-2026-10-29
    paths:
      - .github/workflows/fd76-registry-fix.yml

permissions:
  contents: write

jobs:
  update-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: baseline-supabase-canonical-backend-2026-10-29
          fetch-depth: 0
      - name: Align canonical baseline registry with FD-76 manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          manifest_path=root/'governance_evidence/SiloMath_V6_FROZEN_MANIFEST_2026-10-29_SUPABASE.json'
          validation_path='governance_evidence/SiloMath_V6_Refreeze_Validation_2026-10-29_SUPABASE.json'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          reg_path=root/'engineering/baseline-registry.json'
          reg=json.loads(reg_path.read_text(encoding='utf-8-sig'))
          reg['refreezeDate']='2026-10-29'
          reg['refreezeType']='CR-ARCH-SUPABASE-BACKEND-001 approved Supabase-only canonical core backend platform'
          reg['manifest']=manifest_path.as_posix()
          reg['validationEvidence']=validation_path
          by_path={d['path']:d for d in manifest['documents']}
          for d in reg['documents']:
              m=by_path[d['file']]
              d['sha256']=m['sha256']
              d['bytes']=m['bytes']
          reg.setdefault('contractValidationEvidence',{})['CR-ARCH-SUPABASE-BACKEND-001']=validation_path
          reg_path.write_text(json.dumps(reg,indent=2)+'\n',encoding='utf-8')

          validator=root/'engineering/validate-baseline-registry.ps1'
          text=validator.read_text(encoding='utf-8-sig')
          text=text.replace('if ($registry.refreezeDate -ne "2026-10-28") {\n    $errors.Add("refreezeDate must be 2026-10-28.")\n}', 'if ($registry.refreezeDate -ne "2026-10-29") {\n    $errors.Add("refreezeDate must be 2026-10-29.")\n}')
          validator.write_text(text,encoding='utf-8-sig')
          PY
      - name: Validate updated registry
        shell: pwsh
        run: ./engineering/validate-baseline-registry.ps1
      - name: Commit registry alignment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engineering/baseline-registry.json engineering/validate-baseline-registry.ps1
          git commit -m 'Align baseline registry with FD-76 refreeze'
          git push origin HEAD:baseline-supabase-canonical-backend-2026-10-29
